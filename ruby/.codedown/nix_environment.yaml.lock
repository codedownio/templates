channels:
- src:
    tag: fetch_from_github
    owner: codedownio
    repo: codedown-languages
    rev: d620b2136407a38d589b766b3ac847c42b22d639
    hash: sha256-3ACh6Vef5eJTJTlj1G0Bm9KzoI6MWeH/jq0IPhcO/YI=
    timestamp: 2026-09-01T01:08:03Z
  packages:
  - name: kernels.ruby
    settings:
      enable: true
    meta:
      name: ruby-3.4.9
      description: Object-oriented language for quick and easy programming
      display_name: Ruby
      has_packages: true
      homepage: https://www.ruby-lang.org/
      icon: /nix/store/sc66pp2sd7ia91x4yy4clsb51vqrk6jj-iruby-64x64.png
      icon_monochrome: /nix/store/alkhracd1cin435ydiz8av3zbs6jjhy8-ruby-monochrome.svg
      language_server_names:
      - solargraph
      main_program: ruby
      maintainers: []
      modes:
        attrs:
        - ruby
        code_mirror_mode: ruby
        extensions:
        - rb
      settings_schema:
        packages:
          defaultValue: []
          hidden: true
          listType:
            type: string
          title: List of packages
          type: list
        enable:
          defaultValue: false
          hidden: true
          title: Enable Ruby kernel
          type: boolean
        interface.attrs:
          defaultValue:
          - ruby
          description: Notebook cells that have these attributes will match this kernel,
            allowing it to run the code.
          listType:
            type: string
          title: Notebook attributes
          type: list
        interface.extensions:
          defaultValue:
          - rb
          description: Files with these extensions will match against this kernel,
            allowing you to run the code as if it were a Jupyter cell.
          listType:
            type: string
          title: File extensions
          type: list
        lsp.solargraph.enable:
          defaultValue: true
          title: Enable Solargraph language server
          type: boolean
        lsp.solargraph.rubocopYaml:
          codeMirrorMode: yaml
          defaultValue: |
            # Disable whitespace-related rules that don't play well with notebooks
            Layout/EmptyLines:
              Enabled: false
            Layout/LeadingEmptyLines:
              Enabled: false
            Layout/TrailingEmptyLines:
              Enabled: false

            # This one seems to appear randomly
            Style/FrozenStringLiteralComment:
              Enabled: false
          title: YAML configuration for the rubocop reporter
          type: lines
        misc.enableVariableInspector:
          defaultValue: true
          description: This will show a summary of the currently defined variables
            in the UI.
          title: Enable the variable inspector
          type: boolean
        rubyPackage:
          defaultValue: ruby
          title: Ruby version
          type: enum
          values:
          - ruby
          - ruby_3_3
          - ruby_3_4
      spdx_id: Ruby
  - name: language-servers.spellchecker
    settings:
      enable: true
      markdown:
        enable: true
      typst:
        checkBlockComments: false
        checkLineComments: false
        enable: true
    meta:
      name: hunspell-1.7.2
      category: Language servers
      changelog: https://github.com/hunspell/hunspell/releases/tag/v1.7.2
      description: Spell checker
      display_name: Spellchecker 0.6.3
      homepage: http://hunspell.github.io/
      icon: /nix/store/iv0l66606331c2463l17avxrk4j2wjai-pen-alt.png
      icon_monochrome: /nix/store/fgg1fxac13xjhlzzak131dgr8l76wnvb-pen-alt.svg
      language_server_names:
      - markdown-spellchecker
      - typst-spellchecker
      main_program: hunspell
      maintainers:
      - name: Seth Flynn
        email: getchoo@tuta.io
        github: getchoo
        githubId: 48872998
        matrix: '@getchoo:matrix.org'
      - name: Ross Smyth
        github: RossSmyth
        githubId: 18294397
        matrix: '@rosssmyth:matrix.org'
      settings_schema:
        enable:
          defaultValue: false
          description: Enable the spellchecker language server(s).
          hidden: true
          loc:
          - enable
          title: Enable spellchecker
          type: boolean
        markdown.enable:
          defaultValue: true
          description: Include the Markdown spellchecker (.md, .ipynb).
          loc:
          - markdown
          - enable
          title: Check Markdown
          type: boolean
        typst.checkBlockComments:
          defaultValue: false
          description: Spellcheck the prose inside Typst block comments (/* ... */).
          loc:
          - typst
          - checkBlockComments
          title: Check Typst block comments
          type: boolean
        typst.checkLineComments:
          defaultValue: false
          description: Spellcheck the prose inside Typst line comments (// ...).
          loc:
          - typst
          - checkLineComments
          title: Check Typst line comments
          type: boolean
        typst.enable:
          defaultValue: true
          description: Include the Typst spellchecker (.typ).
          loc:
          - typst
          - enable
          title: Check Typst
          type: boolean
  - name: shells.zsh
    meta:
      name: zsh-5.9.1
      description: Z shell
      display_name: ZSH 5.9.1
      homepage: https://www.zsh.org/
      icon: /nix/store/nzgsbafx1li5igxbs70wi1hqhk2wdhzh-zsh-color.svg
      icon_monochrome: /nix/store/pxi818izs009a3qrd0k7szw7pkchq3h6-zsh-monochrome.svg
      main_program: zsh-with-theme
      maintainers:
      - name: Pascal Wittmann
        email: mail@pascal-wittmann.de
        github: pSub
        githubId: 83842
      - name: Artturi N
        email: artturin@artturin.com
        github: Artturin
        githubId: 56650223
        matrix: '@artturin:matrix.org'
      spdx_id: MIT-Modern-Variant
      version: 5.9.1
  settings_schema: {}
- src:
    tag: fetch_from_github
    owner: NixOS
    repo: nixpkgs
    rev: cd648d6ea62bc0ffba91e61fcfe5e33c1e2004b1
    hash: sha256-pg6hLjDeAWaUOzh2JM2Cw0BwYpGtOyNr6A4FBwP9Ymo=
    timestamp: 2026-07-06T22:09:36Z
    ref:
      tag: branch
      contents: release-25.11
  packages: []
  settings_schema:
    extraNix:
      codeMirrorMode: nix
      defaultValue: ''
      description: Arbitrary Nix expression that evaluates to a derivation, which
        will be joined into the environment. The expression has "pkgs" in scope, an
        imported Nixpkgs package set.
      loc:
      - extraNix
      placeholder: |
        with pkgs;
        symlinkJoin {
          name = "extra-packages";
          paths = [ hello cowsay ];
        }
      title: Extra Nix
      type: lines
settings:
  default_kernel: $.channels[0].packages[0]
