channels:
- src:
    tag: fetch_from_github
    owner: codedownio
    repo: codedown-languages
    rev: cb726a11c6ac5190dee42afb59c97e1bcf1bc725
    hash: sha256-s9jYrRWRURb9dxIZSlXhUM4jQXLu2cuI5xu+yOzghPg=
    timestamp: 2026-08-29T06:40:28Z
  packages:
  - name: kernels.julia
    settings:
      enable: true
    meta:
      name: julia-1.12.6
      description: High-level performance-oriented dynamical language for technical
        computing
      display_name: Julia 1.12.6
      has_packages: true
      homepage: https://julialang.org/
      icon: /nix/store/y1ghpvc1fbzyzdpxjdn6xp88xg8hvwnv-julia-logo-64x64.png
      icon_monochrome: /nix/store/vk9g2ibw2gpqki1sx3d8krq122ksxvh3-julia-monochrome.svg
      language_server_names:
      - LanguageServer
      main_program: julia
      maintainers:
      - name: Nick Cao
        email: nickcao@nichi.co
        github: NickCao
        githubId: 15247171
      - name: Joshua Niemelä
        email: josh@jniemela.dk
        github: joshniemela
        githubId: 88747315
      - name: Tom McLaughlin
        email: tom@codedown.io
        github: thomasjm
        githubId: 1634990
      - name: Sergey Volkov
        email: taranarmo@gmail.com
        github: taranarmo
        githubId: 11619234
      modes:
        attrs:
        - julia
        code_mirror_mode: julia
        extensions:
        - jl
      settings_schema:
        packages:
          defaultValue: []
          hidden: true
          listType:
            type: string
          title: List of packages
          type: list
        enable:
          defaultValue: false
          hidden: true
          title: Enable Haskell kernel
          type: boolean
        interface.attrs:
          defaultValue:
          - julia
          description: Notebook cells that have these attributes will match this kernel,
            allowing it to run the code.
          listType:
            type: string
          title: Notebook attributes
          type: list
        interface.extensions:
          defaultValue:
          - jl
          description: Files with these extensions will match against this kernel,
            allowing you to run the code as if it were a Jupyter cell.
          listType:
            type: string
          title: File extensions
          type: list
        juliaPackage:
          defaultValue: julia
          title: Julia version
          type: enum
          values:
          - julia
          - julia-lts
          - julia-lts-bin
          - julia-stable
          - julia-stable-bin
          - julia_110
          - julia_110-bin
          - julia_111
          - julia_111-bin
          - julia_112
          - julia_112-bin
          - julia_19
          - julia_19-bin
        lsp.LanguageServer.debug:
          defaultValue: false
          title: Log debug messages to stderr
          type: boolean
        lsp.LanguageServer.enable:
          defaultValue: true
          title: Enable LanguageServer language server
          type: boolean
        lsp.LanguageServer.index:
          defaultValue: true
          title: Auto-index packages when building environment
          type: boolean
        misc.enableVariableInspector:
          defaultValue: true
          description: This will show a summary of the currently defined variables
            in the UI.
          title: Enable the variable inspector
          type: boolean
        precompile:
          defaultValue: true
          description: In some cases, precompilation can make the build fail, so turning
            this off can help.
          title: Precompile Julia environment for faster imports
          type: boolean
      spdx_id: MIT
  - name: language-servers.spellchecker
    settings:
      enable: true
      markdown:
        enable: true
      typst:
        checkBlockComments: false
        checkLineComments: false
        enable: true
    meta:
      name: hunspell-1.7.2
      category: Language servers
      changelog: https://github.com/hunspell/hunspell/releases/tag/v1.7.2
      description: Spell checker
      display_name: Spellchecker 0.6.3
      homepage: http://hunspell.github.io/
      icon: /nix/store/iv0l66606331c2463l17avxrk4j2wjai-pen-alt.png
      icon_monochrome: /nix/store/fgg1fxac13xjhlzzak131dgr8l76wnvb-pen-alt.svg
      language_server_names:
      - markdown-spellchecker
      - typst-spellchecker
      main_program: hunspell
      maintainers:
      - name: Seth Flynn
        email: getchoo@tuta.io
        github: getchoo
        githubId: 48872998
        matrix: '@getchoo:matrix.org'
      - name: Ross Smyth
        github: RossSmyth
        githubId: 18294397
        matrix: '@rosssmyth:matrix.org'
      settings_schema:
        enable:
          defaultValue: false
          description: Enable the spellchecker language server(s).
          hidden: true
          loc:
          - enable
          title: Enable spellchecker
          type: boolean
        markdown.enable:
          defaultValue: true
          description: Include the Markdown spellchecker (.md, .ipynb).
          loc:
          - markdown
          - enable
          title: Check Markdown
          type: boolean
        typst.checkBlockComments:
          defaultValue: false
          description: Spellcheck the prose inside Typst block comments (/* ... */).
          loc:
          - typst
          - checkBlockComments
          title: Check Typst block comments
          type: boolean
        typst.checkLineComments:
          defaultValue: false
          description: Spellcheck the prose inside Typst line comments (// ...).
          loc:
          - typst
          - checkLineComments
          title: Check Typst line comments
          type: boolean
        typst.enable:
          defaultValue: true
          description: Include the Typst spellchecker (.typ).
          loc:
          - typst
          - enable
          title: Check Typst
          type: boolean
  - name: shells.zsh
    meta:
      name: zsh-5.9
      description: Z shell
      display_name: ZSH 5.9
      homepage: https://www.zsh.org/
      icon: /nix/store/nzgsbafx1li5igxbs70wi1hqhk2wdhzh-zsh-color.svg
      icon_monochrome: /nix/store/pxi818izs009a3qrd0k7szw7pkchq3h6-zsh-monochrome.svg
      main_program: zsh-with-theme
      maintainers:
      - name: Pascal Wittmann
        email: mail@pascal-wittmann.de
        github: pSub
        githubId: 83842
      - name: Artturi N
        email: artturin@artturin.com
        github: Artturin
        githubId: 56650223
        matrix: '@artturin:matrix.org'
      spdx_id: MIT-Modern-Variant
      version: '5.9'
  settings_schema: {}
- src:
    tag: fetch_from_github
    owner: NixOS
    repo: nixpkgs
    rev: cd648d6ea62bc0ffba91e61fcfe5e33c1e2004b1
    hash: sha256-pg6hLjDeAWaUOzh2JM2Cw0BwYpGtOyNr6A4FBwP9Ymo=
    timestamp: 2026-07-06T22:09:36Z
    ref:
      tag: branch
      contents: release-25.11
  packages: []
  settings_schema:
    extraNix:
      codeMirrorMode: nix
      defaultValue: ''
      description: Arbitrary Nix expression that evaluates to a derivation, which
        will be joined into the environment. The expression has "pkgs" in scope, an
        imported Nixpkgs package set.
      loc:
      - extraNix
      placeholder: |
        with pkgs;
        symlinkJoin {
          name = "extra-packages";
          paths = [ hello cowsay ];
        }
      title: Extra Nix
      type: lines
settings:
  default_kernel: $.channels[0].packages[0]
